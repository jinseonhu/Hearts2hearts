<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>하투하 일정 모아보기</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-512.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="theme-color" content="#5b6cff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="하투하 일정">
  <style>
    body { font-family: -apple-system, "Malgun Gothic", sans-serif; margin: 0; background: #f7f7fb; color: #222; }
    header { background: #5b6cff; color: #fff; padding: 16px 20px; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; font-size: 13px; opacity: .9; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .filters button { border: 1px solid #ccd; background: #fff; border-radius: 16px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
    .filters button.active { background: #5b6cff; color: #fff; border-color: #5b6cff; }
    .card { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); cursor: pointer; }
    .card:hover { box-shadow: 0 2px 6px rgba(0,0,0,.12); }
    .date { font-weight: 700; color: #5b6cff; font-size: 14px; }
    .title { font-size: 16px; margin: 4px 0; font-weight: 600; }
    .meta { font-size: 13px; color: #666; }
    .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #eef; color: #445; margin-top: 6px; }
    .badge.official { background: #e3f7e8; color: #1b6b35; }
    .detail { display: none; margin-top: 12px; border-top: 1px solid #eee; padding-top: 12px; font-size: 14px; line-height: 1.6; }
    .detail.open { display: block; }
    .detail h4 { margin: 10px 0 2px; font-size: 13px; color: #5b6cff; }
    .detail p { margin: 0; }
    .detail a { display: inline-block; margin-top: 4px; background: #5b6cff; color: #fff; padding: 6px 12px; border-radius: 8px; text-decoration: none; font-size: 13px; }
    .hint { font-size: 11px; color: #999; }
    .past .date { color: #999; }
    .card.past .title { color: #777; }
    .past-toggle { display: block; width: 100%; margin: 16px 0 8px; padding: 12px; border: 1px dashed #aab; background: #fff; border-radius: 12px; color: #5b6cff; font-size: 14px; font-weight: 600; cursor: pointer; }
    .past-heading { font-size: 13px; color: #888; margin: 8px 0; font-weight: 600; }
    .empty { text-align: center; color: #999; padding: 40px 0; }
    .fancam-btn { display: inline-block; margin-top: 12px; background: #fff; color: #5b6cff; text-decoration: none; font-weight: 700; font-size: 14px; padding: 9px 16px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  </style>
</head>
<body>
  <header>
    <h1>하투하 일정 모아보기</h1>
    <p>하츠투하츠 공연·축제·시상식 일정 (업데이트: <span id="updated"></span>)</p>
    <a class="fancam-btn" href="fancam.html">🎬 직캠 모아보기 →</a>
  </header>
  <main>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </main>
  <script>
    let all = [];
    let currentType = "전체";
    let openKey = null;
    let showPast = false;

    function isOfficial(status) {
      return status.indexOf("공식") !== -1 && status.indexOf("확인 필요") === -1;
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }

    function detailHTML(e) {
      const ticketBlock = e.ticket_url
        ? `<a href="${esc(e.ticket_url)}" target="_blank" rel="noopener">티켓 예매 페이지 열기</a>`
        : `<p class="hint">링크 없음 (판매처 공지 확인 필요)</p>`;
      const noticeBlock = e.ticket_notice
        ? `<a href="${esc(e.ticket_notice)}" target="_blank" rel="noopener" style="background:#fff;color:#5b6cff;border:1px solid #5b6cff">공지 글 보기</a>`
        : "";
      const sourceBlock = e.source
        ? `<h4>출처</h4><a href="${esc(e.source)}" target="_blank" rel="noopener">출처 글 보기</a>`
        : "";
      return `
        <div>
          <h4>티켓 판매 시간</h4>
          <p>${esc(e.ticket_time || "미확인")}</p>
          <h4>판매처</h4>
          <p>${esc(e.ticket_site || "미확인")}</p>
          <h4>티켓 링크</h4>
          ${ticketBlock} ${noticeBlock}
          <h4>메모</h4>
          <p>${esc(e.notes || "")}</p>
          ${sourceBlock}
        </div>`;
    }

    function cardHTML(e, past) {
      const key = e.date + "|" + e.title;
      const official = isOfficial(e.status);
      const isOpen = openKey === key;
      return `
          <div class="card${past ? " past" : ""}" data-key="${esc(key)}">
            <div class="date">${esc(e.date)}${e.end ? " ~ " + esc(e.end) : ""}</div>
            <div class="title">${esc(e.title)}</div>
            <div class="meta">${esc(e.type)} · ${esc(e.place)}</div>
            <span class="badge ${official ? "official" : ""}">${esc(e.status)}</span>
            <div class="detail ${isOpen ? "open" : ""}">${isOpen ? detailHTML(e) : ""}</div>
          </div>`;
    }

    function render() {
      const list = document.getElementById("list");
      const today = new Date().toISOString().slice(0, 10);
      const filtered = all.filter(e => currentType === "전체" || e.type === currentType);
      const endOf = e => e.end || e.date;
      const upcoming = filtered.filter(e => endOf(e) >= today)
        .sort((a, b) => a.date.localeCompare(b.date));
      const past = filtered.filter(e => endOf(e) < today)
        .sort((a, b) => b.date.localeCompare(a.date));

      let html = upcoming.length
        ? upcoming.map(e => cardHTML(e, false)).join("")
        : '<div class="empty">예정된 일정이 없습니다.</div>';

      if (past.length) {
        html += `<button class="past-toggle" id="pastToggle">${showPast ? "지난 일정 숨기기 ▲" : "지난 일정 보기 (" + past.length + "개) ▼"}</button>`;
        if (showPast) {
          html += `<div class="past-heading">지난 일정</div>` + past.map(e => cardHTML(e, true)).join("");
        }
      }
      list.innerHTML = html;
    }

    document.getElementById("list").addEventListener("click", ev => {
      if (ev.target.id === "pastToggle") {
        showPast = !showPast;
        openKey = null;
        render();
        return;
      }
      if (ev.target.tagName === "A") return;
      const card = ev.target.closest(".card");
      if (!card) return;
      const key = card.dataset.key;
      openKey = openKey === key ? null : key;
      render();
    });

    function renderFilters() {
      const types = ["전체", ...new Set(all.map(e => e.type))];
      document.getElementById("filters").innerHTML = types.map(t =>
        `<button class="${t === currentType ? "active" : ""}" data-type="${esc(t)}">${esc(t)}</button>`
      ).join("");
      document.querySelectorAll("#filters button").forEach(btn => {
        btn.addEventListener("click", () => {
          currentType = btn.dataset.type;
          openKey = null;
          renderFilters();
          render();
        });
      });
    }
