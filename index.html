<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>하투하 일정 모아보기</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-512.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="theme-color" content="#6c5cff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="하투하 일정">
  <style>
    :root {
      --bg: #f5f4fb;
      --surface: #ffffff;
      --text: #1d1b2e;
      --muted: #6e6a85;
      --line: #e7e5f2;
      --brand: #6c5cff;
      --brand-2: #ff6fa8;
      --shadow: 0 6px 20px rgba(60, 40, 120, .08);
      --c-fest: #ff5c8a;
      --c-award: #f5a524;
      --c-fan: #20b486;
      --c-broadcast: #3b82f6;
      --c-concert: #8b5cf6;
      --c-default: #6c5cff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14121f;
        --surface: #1f1c30;
        --text: #f1eefc;
        --muted: #a39fbd;
        --line: #302c48;
        --shadow: 0 6px 20px rgba(0, 0, 0, .35);
      }
    }
    :root[data-theme="dark"] {
      --bg: #14121f;
      --surface: #1f1c30;
      --text: #f1eefc;
      --muted: #a39fbd;
      --line: #302c48;
      --shadow: 0 6px 20px rgba(0, 0, 0, .35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #6c5cff 0%, #b15cff 45%, #ff6fa8 100%);
      color: #fff;
      padding: 28px 20px 64px;
    }
    .hero svg.deco { position: absolute; right: -40px; top: -30px; width: 260px; opacity: .22; }
    .hero-inner { position: relative; max-width: 760px; margin: 0 auto; }
    .hero h1 { margin: 0; font-size: 26px; letter-spacing: -.5px; }
    .hero .sub { margin: 6px 0 0; font-size: 14px; opacity: .92; }
    .hero .fancam-btn {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 14px;
      background: rgba(255,255,255,.95); color: var(--brand); text-decoration: none;
      font-weight: 700; font-size: 14px; padding: 9px 16px; border-radius: 999px;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }
    main { max-width: 760px; margin: -36px auto 0; padding: 0 14px 40px; position: relative; }
    .toolbar {
      background: var(--surface); border-radius: 16px; padding: 12px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 10px;
    }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .filters button {
      border: 1px solid var(--line); background: transparent; color: var(--text);
      border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-family: inherit;
    }
    .filters button.active { background: var(--brand); color: #fff; border-color: var(--brand); }
    .legend { font-size: 12px; color: var(--muted); }
    .section-title { display: flex; align-items: baseline; gap: 8px; margin: 22px 4px 10px; font-size: 15px; font-weight: 700; }
    .section-title .count { font-size: 12px; color: var(--muted); font-weight: 500; }

    .card {
      position: relative; display: grid; grid-template-columns: 84px 1fr; overflow: hidden;
      background: var(--surface); border-radius: 16px; box-shadow: var(--shadow);
      margin-bottom: 12px; cursor: pointer; transition: transform .15s ease;
    }
    .card:hover { transform: translateY(-2px); }
    .card.past { opacity: .72; }
    .card.past:hover { opacity: 1; }
    .thumb {
      position: relative; color: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 10px 4px; text-align: center;
      background: linear-gradient(160deg, var(--c) 0%, color-mix(in srgb, var(--c) 55%, #000) 100%);
      overflow: hidden;
    }
    .thumb svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .25; }
    .thumb .mon { position: relative; font-size: 12px; font-weight: 600; opacity: .9; }
    .thumb .day { position: relative; font-size: 28px; font-weight: 800; line-height: 1.1; }
    .thumb .dow { position: relative; font-size: 11px; opacity: .9; }
    .body { padding: 12px 14px 14px; min-width: 0; }
    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .type-chip {
      font-size: 11px; font-weight: 700; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
      padding: 3px 9px; border-radius: 999px;
    }
    .dday { font-size: 12px; font-weight: 700; color: var(--c); white-space: nowrap; }
    .dday.past { color: var(--muted); }
    .title { font-size: 16px; font-weight: 700; margin: 8px 0 4px; word-break: keep-all; }
    .meta { font-size: 13px; color: var(--muted); word-break: keep-all; }
    .ticket-line {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px;
      font-size: 12px; color: var(--text);
    }
    .ticket-line .pill {
      background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
    }
    .ticket-line .pill.ok { border-color: #20b48666; color: #0f8a62; }
    .status { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .status.official { color: #0f8a62; font-weight: 600; }

    .detail { display: none; grid-column: 1 / -1; border-top: 1px solid var(--line); padding: 14px; margin: 0 -14px -14px; }
    .card.open .detail { display: block; }
    .card { grid-template-rows: auto; }
    .detail-wrap { grid-column: 1 / -1; }
    .card.open { grid-template-columns: 84px 1fr; }
    .card.open .detail { grid-column: 1 / -1; }
    .ticket-box {
      background: linear-gradient(135deg, color-mix(in srgb, var(--c) 12%, transparent), transparent);
      border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px;
    }
    .kv { display: grid; grid-template-columns: 74px 1fr; gap: 6px 10px; font-size: 13px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; word-break: keep-all; }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: 13px; font-weight: 700;
      padding: 9px 14px; border-radius: 10px; border: 1px solid var(--c); color: var(--c); background: transparent;
    }
    .btn.primary { background: var(--c); color: #fff; }
    .note { font-size: 13px; color: var(--text); margin: 6px 0 0; word-break: keep-all; }
    .label { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 10px; }
    .hint { font-size: 12px; color: var(--muted); }
    .past-toggle {
      display: block; width: 100%; margin: 20px 0 8px; padding: 13px; border: 1px dashed var(--brand);
      background: var(--surface); border-radius: 14px; color: var(--brand); font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    footer { text-align: center; font-size: 12px; color: var(--muted); padding: 10px 0 0; }
    @media (max-width: 480px) {
      .hero h1 { font-size: 22px; }
      .card { grid-template-columns: 72px 1fr; }
      .thumb .day { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <svg class="deco" viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="90" fill="none" stroke="#fff" stroke-width="2"/>
      <circle cx="100" cy="100" r="60" fill="none" stroke="#fff" stroke-width="2"/>
      <circle cx="100" cy="100" r="30" fill="#fff"/>
    </svg>
    <div class="hero-inner">
      <h1>하투하 일정 모아보기</h1>
      <p class="sub">하츠투하츠 공연·축제·시상식 · 업데이트 <span id="updated"></span></p>
      <a class="fancam-btn" href="fancam.html">🎬 직캠 모아보기 →</a>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="filters" id="filters"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div id="list"></div>
    <footer>일정은 공식 발표와 기사 기준이며, 변동될 수 있습니다. 예매 전 판매처 공지를 꼭 확인하세요.</footer>
  </main>

  <script>
    const TYPE_COLOR = {
      "축제": "var(--c-fest)",
      "시상식": "var(--c-award)",
      "팬 이벤트": "var(--c-fan)",
      "방송": "var(--c-broadcast)",
      "공연": "var(--c-concert)"
    };
    const WEEK = ["일", "월", "화", "수", "목", "금", "토"];

    let all = [];
    let currentType = "전체";
    let openKey = null;
    let showPast = false;

    function colorOf(type) { return TYPE_COLOR[type] || "var(--c-default)"; }

    function isOfficial(status) {
      return status.indexOf("공식") !== -1 && status.indexOf("확인 필요") === -1;
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }

    // Decorative thumbnail: abstract pattern per card (no photos of artists).
    function thumbSVG(seed) {
      const n = seed % 3;
      const shapes = [
        '<circle cx="80" cy="20" r="46" fill="none" stroke="#fff" stroke-width="2"/><circle cx="10" cy="90" r="30" fill="#fff" fill-opacity=".5"/>',
        '<path d="M0 60 Q20 30 40 60 T80 60 T120 60" fill="none" stroke="#fff" stroke-width="3"/><path d="M0 85 Q20 55 40 85 T80 85 T120 85" fill="none" stroke="#fff" stroke-width="3"/>',
        '<rect x="50" y="-10" width="40" height="40" rx="8" fill="#fff" fill-opacity=".6" transform="rotate(20 70 10)"/><circle cx="20" cy="80" r="14" fill="#fff"/>'
      ];
      return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${shapes[n]}</svg>`;
    }

    function dateParts(e) {
      const d = new Date(e.date + "T00:00:00");
      return { mon: (d.getMonth() + 1) + "월", day: d.getDate(), dow: WEEK[d.getDay()] };
    }

    function dday(e, today) {
      const end = e.end || e.date;
      const diff = Math.round((new Date(e.date + "T00:00:00") - new Date(today + "T00:00:00")) / 864e5);
      const endDiff = Math.round((new Date(end + "T00:00:00") - new Date(today + "T00:00:00")) / 864e5);
      if (endDiff < 0) return { text: "종료", past: true };
      if (diff <= 0 && endDiff >= 0) return { text: "진행 중", past: false };
      return { text: "D-" + diff, past: false };
    }

    function ticketLine(e) {
      const site = e.ticket_site && !/^해당 없음|^미확인/.test(e.ticket_site) ? e.ticket_site : "";
      const time = e.ticket_time && !/^해당 없음|^미확인/.test(e.ticket_time) ? e.ticket_time : "";
      if (!site && !time) return `<div class="ticket-line"><span class="pill">예매 정보 미확인</span></div>`;
      return `<div class="ticket-line">${site ? `<span class="pill ok">🎫 ${esc(site)}</span>` : ""}${time ? `<span class="pill">⏰ ${esc(time.length > 26 ? time.slice(0, 26) + "…" : time)}</span>` : ""}</div>`;
    }

    function detailHTML(e) {
      const hasTicketUrl = !!e.ticket_url;
      const buttons = [];
      if (hasTicketUrl) buttons.push(`<a class="btn primary" href="${esc(e.ticket_url)}" target="_blank" rel="noopener">🎫 예매 페이지 열기</a>`);
      if (e.ticket_notice) buttons.push(`<a class="btn" href="${esc(e.ticket_notice)}" target="_blank" rel="noopener">📢 판매 공지</a>`);
      if (e.source) buttons.push(`<a class="btn" href="${esc(e.source)}" target="_blank" rel="noopener">🔗 출처 글</a>`);
      return `
        <div class="ticket-box">
          <dl class="kv">
            <dt>판매처</dt><dd>${esc(e.ticket_site || "미확인")}</dd>
            <dt>판매 시간</dt><dd>${esc(e.ticket_time || "미확인")}</dd>
            <dt>장소</dt><dd>${esc(e.place || "")}</dd>
          </dl>
          ${hasTicketUrl ? "" : `<p class="hint" style="margin:8px 0 0">예매 상품 페이지 링크는 아직 확인되지 않았습니다. 판매처 공지를 확인하세요.</p>`}
        </div>
        ${e.notes ? `<div class="label">메모</div><p class="note">${esc(e.notes)}</p>` : ""}
        <div class="btns">${buttons.join("")}</div>`;
    }

    function cardHTML(e, today, past) {
      const key = e.date + "|" + e.title;
      const isOpen = openKey === key;
      const official = isOfficial(e.status);
      const p = dateParts(e);
      const dd = dday(e, today);
      const color = colorOf(e.type);
      const rangeTxt = e.end && e.end !== e.date ? `${p.mon} ${p.day}일 ~ ${dateParts({date: e.end}).day}일` : "";
      return `
        <article class="card${past ? " past" : ""}${isOpen ? " open" : ""}" data-key="${esc(key)}" style="--c:${color}">
          <div class="thumb">
            ${thumbSVG(e.date.charCodeAt(9) + e.title.length)}
            <div class="mon">${p.mon}</div>
            <div class="day">${p.day}</div>
            <div class="dow">${p.dow}요일</div>
          </div>
          <div class="body">
            <div class="top-row">
              <span class="type-chip">${esc(e.type)}</span>
              <span class="dday${dd.past ? " past" : ""}">${esc(dd.text)}</span>
            </div>
            <div class="title">${esc(e.title)}</div>
            <div class="meta">📍 ${esc(e.place)}${rangeTxt ? " · " + rangeTxt : ""}</div>
            ${ticketLine(e)}
            <div class="status${official ? " official" : ""}">${official ? "✔ " : ""}${esc(e.status)}</div>
            ${isOpen ? `<div class="detail">${detailHTML(e)}</div>` : ""}
          </div>
        </article>`;
    }

    function render() {
      const list = document.getElementById("list");
      const today = new Date().toISOString().slice(0, 10);
      const filtered = all.filter(e => currentType === "전체" || e.type === currentType);
      const endOf = e => e.end || e.date;
      const upcoming = filtered.filter(e => endOf(e) >= today).sort((a, b) => a.date.localeCompare(b.date));
      const past = filtered.filter(e => endOf(e) < today).sort((a, b) => b.date.localeCompare(a.date));

      let html = `<div class="section-title">다가오는 일정 <span class="count">${upcoming.length}개</span></div>`;
      html += upcoming.length
        ? upcoming.map(e => cardHTML(e, today, false)).join("")
        : '<div class="empty">예정된 일정이 없습니다.</div>';

      if (past.length) {
        html += `<button class="past-toggle" id="pastToggle">${showPast ? "지난 일정 접기 ▲" : "지난 일정 보기 (" + past.length + "개) ▼"}</button>`;
        if (showPast) {
          html += `<div class="section-title">지난 일정 <span class="count">최신순</span></div>`;
          html += past.map(e => cardHTML(e, today, true)).join("");
        }
      }
      list.innerHTML = html;
    }

    function renderFilters() {
      const types = ["전체", ...new Set(all.map(e => e.type))];
      document.getElementById("filters").innerHTML = types.map(t =>
        `<button class="${t === currentType ? "active" : ""}" data-type="${esc(t)}">${esc(t)}</button>`
      ).join("");
      document.getElementById("legend").textContent = "카드 색은 일정 종류를 나타내요. 카드를 누르면 예매 정보가 펼쳐집니다.";
      document.querySelectorAll("#filters button").forEach(btn => {
        btn.addEventListener("click", () => {
          currentType = btn.dataset.type;
          openKey = null;
          renderFilters();
          render();
        });
      });
    }

    document.getElementById("list").addEventListener("click", ev => {
      if (ev.target.id === "pastToggle") {
        showPast = !showPast;
        openKey = null;
        render();
        return;
      }
      if (ev.target.closest(".detail") && ev.target.tagName === "A") return;
      const card = ev.target.closest(".card");
      if (!card) return;
      const key = card.dataset.key;
      openKey = openKey === key ? null : key;
      render();
