<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png" type="image/png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하투하 직캠">
<title>하투하 직캠</title>
<style>
:root{--bg:#0e0f16;--card:#1a1c28;--card2:#232637;--text:#f2f3f8;--sub:#9a9fb8;--accent:#7c8cff;--accent2:#5b6cff;--line:#2b2f44}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:88px}
header{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;background:linear-gradient(135deg,#5b6cff,#8b5cf6);box-shadow:0 4px 18px rgba(0,0,0,.35)}
header .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px}
header .sub{margin-top:2px;font-size:12px;opacity:.85}
header a.back{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.18);padding:7px 12px;border-radius:999px;white-space:nowrap}
main{padding:14px 14px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;font-size:13px;line-height:1.6;color:var(--sub)}
.box input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:14px;margin-top:8px;outline:none}
.box input::placeholder{color:#6d7290}
.box input:focus{border-color:var(--accent)}
button{font-family:inherit;cursor:pointer;border:0;transition:transform .08s ease,opacity .2s}
button:active{transform:scale(.97)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;background:var(--card);color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.filters button.on{background:linear-gradient(135deg,#5b6cff,#8b5cf6);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(91,108,255,.35)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.card a.thumb{position:relative;display:block;color:var(--text);text-decoration:none}
.card img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:var(--card2)}
.card a.thumb::after{content:"▶";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;padding-left:3px;opacity:.9}
.card .t{font-size:13px;font-weight:600;padding:10px 12px 2px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.card .c{font-size:11px;color:var(--sub);padding:2px 12px 8px}
.card .acts{display:flex;gap:6px;padding:0 10px 10px;margin-top:auto;flex-wrap:wrap}
.card .acts button.fav{background:var(--card2);color:#ffd166;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:600}
.card .acts select.plsel{background:var(--card2);color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:6px 8px;font-size:12px;max-width:100%}
.status{text-align:center;color:var(--sub);padding:60px 10px;font-size:14px}
.more{width:100%;margin-top:14px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px;font-size:14px;font-weight:600}
.pl{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.pl h3{margin:0 0 10px;font-size:16px}
.pl .plrm{margin-top:10px;background:var(--card2);color:#ff8a8a;border-radius:10px;padding:8px 12px;font-size:12px}
.plbox{display:flex;gap:8px;margin-bottom:14px}
.plbox input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:14px;outline:none}
.plbox button{background:linear-gradient(135deg,#5b6cff,#8b5cf6);color:#fff;border-radius:12px;padding:0 16px;font-size:14px;font-weight:700}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:6px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:rgba(20,22,33,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
#tabs button{flex:1;background:transparent;color:var(--sub);border-radius:14px;padding:10px 4px;font-size:13px;font-weight:600}
#tabs button.on{background:var(--card2);color:var(--text)}
#tabs button.ghost{flex:0 0 auto;padding:10px 12px;background:var(--card2);color:var(--accent);font-size:12px}
#setup{display:block}
</style></head><body>
<header>
  <div class="row">
    <div><h1>🎬 직캠</h1><div class="sub">하츠투하츠 멤버별 직캠 모아보기</div></div>
    <a class="back" href="index.html">📅 일정</a>
  </div>
</header>
<main>
  <div class="box" id="setup">
    유튜브 검색을 쓰려면 YouTube API 키를 한 번 넣어야 합니다. 키는 이 기기에만 저장됩니다.
    <input id="key" type="password" placeholder="YouTube API 키 붙여넣기" />
    <button id="saveKey" style="margin-top:10px;background:linear-gradient(135deg,#5b6cff,#8b5cf6);color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:700;width:100%">키 저장</button>
  </div>
  <div id="view"></div>
</main>
<div id="tabs"></div>
<script>
const GROUPS = {
  "하츠투하츠": {ko:"하츠투하츠", en:"Hearts2Hearts", members:["카르멘","지우","유하","스텔라","주은","에이나","이안","예온"]},
  "키키": {ko:"키키", en:"KiiiKiii", members:["하음"]},
  "뉴진스": {ko:"뉴진스", en:"NewJeans", members:["민지","하니","해린"]},
  "에스파": {ko:"에스파", en:"aespa", members:["윈터","카리나"]},
  "엔믹스": {ko:"엔믹스", en:"NMIXX", members:["지우","규진","설윤"]},
  "베이비몬스터": {ko:"베이비몬스터", en:"BABYMONSTER", members:["아현"]},
  "스테이씨": {ko:"스테이씨", en:"StayC", members:["아이사"]},
  "아이브": {ko:"아이브", en:"IVE", members:["레이"]}
};
const ALIASES = {
  "카르멘": ["카르멘","karmen","carmen"],
  "지우": ["지우","jiwoo"],
  "유하": ["유하","yuha"],
  "스텔라": ["스텔라","stella"],
  "주은": ["주은","juun","joo eun","jooeun"],
  "에이나": ["에이나","ain"],
  "이안": ["이안","ian"],
  "예온": ["예온","yeon","yewon"],
  "하음": ["하음","haeum"],
  "민지": ["민지","minji"],
  "하니": ["하니","hanni"],
  "해린": ["해린","haerin"],
  "윈터": ["윈터","winter"],
  "카리나": ["카리나","karina"],
  "규진": ["규진","kyujin"],
  "설윤": ["설윤","sullyoon"],
  "아현": ["아현","ahyeon"],
  "아이사": ["아이사","aisa"],
  "레이": ["레이","rei"]
};
const KEY_NAME = "h2h_yt_key", FAV_NAME = "h2h_fav", PL_NAME = "h2h_playlists", ORDER_NAME = "h2h_order", GROUP_NAME = "h2h_group";
let tab = "멤버";
let group = (()=>{ try { return localStorage.getItem(GROUP_NAME) || "하츠투하츠"; } catch(e){ return "하츠투하츠"; } })();
if (!GROUPS[group]) group = "하츠투하츠";
let member = GROUPS[group].members[0];
let order = (localStorage.getItem(ORDER_NAME) || "date");
let nextTokens = {}, cache = {}, loading = {};

const store = {
  get(name, def){ try { return JSON.parse(localStorage.getItem(name)) ?? def; } catch(e){ return def; } },
  set(name, v){ try { localStorage.setItem(name, JSON.stringify(v)); } catch(e){} }
};
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function getKey(){ try { return localStorage.getItem(KEY_NAME) || ""; } catch(e){ return ""; } }
function favs(){ return store.get(FAV_NAME, []); }
function playlists(){ return store.get(PL_NAME, {}); }
function isFav(id){ return favs().some(f => f.id === id); }
function ck(m){ return group + "/" + m; }

function toggleFav(v){
  let list = favs();
  if (list.some(f => f.id === v.id)) list = list.filter(f => f.id !== v.id);
  else list.unshift(v);
  store.set(FAV_NAME, list);
  render();
}

function cardHTML(v){
  const fav = isFav(v.id);
  const pls = Object.keys(playlists());
  const plSelect = pls.length
    ? `<select class="plsel" data-id="${esc(v.id)}"><option value="">재생목록에 추가</option>${pls.map(p=>`<option>${esc(p)}</option>`).join("")}</select>`
    : "";
  return `<div class="card">
    <a class="thumb" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener">
      <img src="${esc(v.thumb)}" alt=""><div class="t">${esc(v.title)}</div></a>
    <div class="c">${esc(v.channel)} · ${esc(v.date)}</div>
    <div class="acts">
      <button class="fav" data-v='${esc(JSON.stringify(v))}'>${fav ? "★ 즐겨찾기 해제" : "☆ 즐겨찾기"}</button>
      ${plSelect}
    </div></div>`;
}

function bindCards(root){
  root.querySelectorAll(".fav").forEach(b => b.onclick = () => toggleFav(JSON.parse(b.dataset.v)));
  root.querySelectorAll(".plsel").forEach(s => s.onchange = () => {
    if (!s.value) return;
    const pl = playlists(); const v = findVideo(s.dataset.id);
    pl[s.value] = pl[s.value] || [];
    if (v && !pl[s.value].some(x => x.id === v.id)) pl[s.value].push(v);
    store.set(PL_NAME, pl); alert("재생목록에 추가했습니다."); render();
  });
}
function findVideo(id){
  for (const k in cache) { const f = cache[k].find(x => x.id === id); if (f) return f; }
  return favs().find(x => x.id === id);
}

function parseDur(d){
  const m = (d||"").match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  return m ? (+m[1]||0)*3600 + (+m[2]||0)*60 + (+m[3]||0) : 0;
}
function isShort(v){
  return v.seconds <= 60 || /#?shorts|쇼츠/i.test(v.title);
}
function escRe(t){ return t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function mentions(title, name){
  return (ALIASES[name] || [name]).some(a => {
    const re = /^[a-z ]+$/i.test(a) ? new RegExp("(^|[^a-z])" + escRe(a) + "([^a-z]|$)", "i") : new RegExp(escRe(a));
    return re.test(title);
  });
}
function isForMember(v, m){
  const t = v.title;
  if (!mentions(t, m)) return false;
  return !GROUPS[group].members.some(o => o !== m && mentions(t, o));
}
function queriesFor(m){
  const g = GROUPS[group];
  return [`${g.ko} ${m} 직캠`, `${m} 직캠 ${g.ko}`, `${g.en} ${m} fancam`];
}

async function apiGet(path, params){
  const p = new URLSearchParams({...params, key: getKey()});
  const r = await fetch("https://www.googleapis.com/youtube/v3/" + path + "?" + p.toString());
  const data = await r.json();
  if (!r.ok) throw new Error(data.error && data.error.message ? data.error.message : "검색 실패");
  return data;
}
async function searchQuery(q, pageToken){
  const params = {part:"snippet", type:"video", maxResults:"50", q, regionCode:"KR", relevanceLanguage:"ko", order};
  if (pageToken) params.pageToken = pageToken;
  return apiGet("search", params);
}
function toVideo(it){
  const sn = it.snippet;
  return { id: it.id.videoId, title: sn.title, channel: sn.channelTitle, date: (sn.publishedAt || "").slice(0,10), thumb: (sn.thumbnails.medium || sn.thumbnails.default || {}).url || "", seconds: 0 };
}
async function fillDurations(list){
  const need = list.filter(v => !v.seconds);
  for (let i = 0; i < need.length; i += 50) {
    const chunk = need.slice(i, i+50);
    const data = await apiGet("videos", {part:"contentDetails", id: chunk.map(v=>v.id).join(",")});
    const map = {};
    data.items.forEach(it => map[it.id] = parseDur(it.contentDetails.duration));
    chunk.forEach(v => v.seconds = map[v.id] || 0);
  }
  return list;
}

async function loadMember(m, more){
  const key = ck(m) + (more ? ":more" : "");
  if (!getKey()) { document.getElementById("view").innerHTML = `<div class="status">위에서 API 키를 먼저 저장해 주세요.</div>`; return; }
  if (loading[key]) return;
  loading[key] = true;
  const btn = document.getElementById("more"); if (btn) btn.textContent = "불러오는 중…";
  try {
    let items = [];
    if (!more) {
      const saved = store.get("h2h_cache/" + ck(m) + "/" + order, null);
      if (saved && Date.now() - saved.t < 12*60*60*1000) {
        cache[ck(m)] = saved.items; nextTokens[ck(m)] = saved.next;
        render(); bindCards(document.getElementById("view"));
        return;
      }
      cache[ck(m)] = []; nextTokens[ck(m)] = null;
      const qs = queriesFor(m);
      const results = await Promise.all(qs.map((q, i) => searchQuery(q, undefined).catch(e => i === 0 ? Promise.reject(e) : {items:[], nextPageToken:null})));
      nextTokens[ck(m)] = results[0].nextPageToken || null;
      items = results.flatMap(r => r.items.map(toVideo));
    } else {
      const data = await searchQuery(queriesFor(m)[0], nextTokens[ck(m)]);
      nextTokens[ck(m)] = data.nextPageToken || null;
      items = data.items.map(toVideo);
    }
    const ids = new Set((cache[ck(m)] || []).map(x => x.id));
    const unique = items.filter((v, i, arr) => !ids.has(v.id) && arr.findIndex(x => x.id === v.id) === i);
    await fillDurations(unique);
    const kept = unique.filter(v => !isShort(v) && isForMember(v, m));
    const merged = (cache[ck(m)] || []).concat(kept);
    cache[ck(m)] = merged.filter((v, i, arr) => arr.findIndex(x => x.id === v.id) === i).sort((a, b) => b.date.localeCompare(a.date));
    if (!more) store.set("h2h_cache/" + ck(m) + "/" + order, {t: Date.now(), items: cache[ck(m)], next: nextTokens[ck(m)]});
    if (more) {
      const grid = document.getElementById("grid");
      if (grid) grid.insertAdjacentHTML("beforeend", kept.map(cardHTML).join(""));
      const b = document.getElementById("more");
      if (b) { if (nextTokens[ck(m)]) b.textContent = "더 보기"; else b.remove(); }
    } else render();
    bindCards(document.getElementById("view"));
  } catch(e) {
    document.getElementById("view").innerHTML = `<div class="status">불러오지 못했습니다: ${esc(e.message)}</div>`;
  } finally {
    loading[key] = false;
  }
}

function render(){
  document.getElementById("tabs").innerHTML =
    ["멤버","즐겨찾기","재생목록"].map(t => `<button class="${t===tab?"on":""}" data-t="${t}">${t}</button>`).join("") +
    `<button class="ghost" id="ord">${order==="date"?"최신순":"관련순"} ▾</button>`;
  document.querySelectorAll("#tabs [data-t]").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); if (tab==="멤버") loadMember(member); });
  document.getElementById("ord").onclick = () => { order = order==="date" ? "relevance" : "date"; localStorage.setItem(ORDER_NAME, order); cache = {}; render(); loadMember(member); };

  const view = document.getElementById("view");
  if (tab === "멤버") {
    const members = GROUPS[group].members;
    view.innerHTML = `<div class="filters" id="groupbar">${Object.keys(GROUPS).map(g=>`<button class="${g===group?"on":""}" data-g="${esc(g)}">${esc(g)}</button>`).join("")}</div>
      <div class="filters">${members.map(m=>`<button class="${m===member?"on":""}" data-m="${m}">${m}</button>`).join("")}</div>
      <div id="memberBody"></div>`;
    view.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
      group = b.dataset.g; member = GROUPS[group].members[0];
      try { localStorage.setItem(GROUP_NAME, group); } catch(e){}
      render(); loadMember(member);
    });
    view.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { member = b.dataset.m; render(); loadMember(member); });
    const body = document.getElementById("memberBody");
    const list = cache[ck(member)];
    if (!list) { body.innerHTML = `<div class="status">불러오는 중…</div>`; loadMember(member); return; }
    if (!list.length) { body.innerHTML = `<div class="status">검색 결과가 없습니다.</div>`; return; }
    body.innerHTML = `<div class="grid" id="grid">${list.map(cardHTML).join("")}</div>${nextTokens[ck(member)] ? `<button class="more" id="more">더 보기</button>` : ""}`;
    const more = document.getElementById("more"); if (more) more.onclick = () => loadMember(member, true);
    bindCards(view);
  } else if (tab === "즐겨찾기") {
    const list = favs();
    view.innerHTML = list.length ? `<div class="grid">${list.map(cardHTML).join("")}</div>` : `<div class="status">즐겨찾기한 영상이 없습니다. ☆ 버튼을 눌러 추가하세요.</div>`;
    bindCards(view);
  } else {
    const pl = playlists();
    const names = Object.keys(pl);
    view.innerHTML = `
      <div class="plbox"><input id="plname" placeholder="새 재생목록 이름 (예: 지우 무대 모음)"/>
      <button id="plnew">만들기</button></div>
      ${names.length ? names.map(n => `<div class="pl"><h3>${esc(n)} (${pl[n].length})</h3>
          <div class="grid">${pl[n].map(v => cardHTML(v)).join("")}</div>
          <button class="plrm" data-n="${esc(n)}">재생목록 삭제</button></div>`).join("") : `<div class="status">재생목록이 없습니다.</div>`}`;
    document.getElementById("plnew").onclick = () => {
      const n = document.getElementById("plname").value.trim();
      if (!n) return;
      pl[n] = pl[n] || []; store.set(PL_NAME, pl); render();
    };
    view.querySelectorAll(".plrm").forEach(b => b.onclick = () => {
      if (!confirm("이 재생목록을 삭제할까요?")) return;
      const p = playlists(); delete p[b.dataset.n]; store.set(PL_NAME, p); render();
    });
    bindCards(view);
  }
}

document.getElementById("saveKey").onclick = () => {
  const v = document.getElementById("key").value.trim();
  if (!v) return;
  try { localStorage.setItem(KEY_NAME, v); } catch(e){}
  document.getElementById("key").value = "";
  document.getElementById("setup").style.display = "none";
  cache = {}; render(); loadMember(member);
};
if (getKey()) document.getElementById("setup").style.display = "none";
render();
loadMember(member);
</script>
</body></html>
