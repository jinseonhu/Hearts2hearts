<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>하투하 직캠 모아보기</title>
<style>
body{font-family:-apple-system,"Malgun Gothic",sans-serif;margin:0;background:#f7f7fb;color:#222}
header{background:#5b6cff;color:#fff;padding:16px 20px}
header h1{margin:0;font-size:20px}
header a{color:#fff;font-size:13px}
main{max-width:720px;margin:0 auto;padding:16px}
.box{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:13px;line-height:1.6;color:#555}
input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd;border-radius:8px;font-size:14px;margin-top:6px}
button{background:#5b6cff;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
button.ghost{background:#eef;color:#445}
.tabs,.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button,.filters button{background:#fff;color:#445;border:1px solid #ccd;border-radius:16px;padding:6px 10px}
.tabs button.on,.filters button.on{background:#5b6cff;color:#fff;border-color:#5b6cff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card a.thumb{display:block;color:#222;text-decoration:none}
.card img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#ddd}
.card .t{font-size:13px;padding:8px 10px 2px;line-height:1.4;max-height:3em;overflow:hidden}
.card .c{font-size:11px;color:#888;padding:0 10px 4px}
.card .acts{display:flex;gap:6px;padding:6px 10px 10px;flex-wrap:wrap}
.card .acts button{padding:5px 8px;font-size:12px}
.status{text-align:center;color:#888;padding:24px 0;font-size:14px}
.more{width:100%;margin-top:10px}
.pl{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pl h3{margin:0 0 6px;font-size:15px}
</style></head><body>
<header><h1>하투하 직캠 모아보기</h1><a href="index.html">← 일정으로 돌아가기</a></header>
<main>
  <div class="box" id="setup">
    유튜브 검색을 쓰려면 YouTube API 키를 한 번 넣어야 합니다. 키는 이 기기에만 저장됩니다.
    <input id="key" type="password" placeholder="YouTube API 키 붙여넣기" />
    <button id="saveKey">키 저장</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</main>
<script>
const MEMBERS = ["카르멘","지우","유하","스텔라","주은","에이나","이안","예온"];
const KEY_NAME = "h2h_yt_key", FAV_NAME = "h2h_fav", PL_NAME = "h2h_playlists", ORDER_NAME = "h2h_order";
let tab = "멤버";     // 멤버 | 즐겨찾기 | 재생목록
let member = "지우";
let order = (localStorage.getItem(ORDER_NAME) || "date");
let nextTokens = {}, cache = {};

const store = {
  get(name, def){ try { return JSON.parse(localStorage.getItem(name)) ?? def; } catch(e){ return def; } },
  set(name, v){ try { localStorage.setItem(name, JSON.stringify(v)); } catch(e){} }
};
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function getKey(){ try { return localStorage.getItem(KEY_NAME) || ""; } catch(e){ return ""; } }
function favs(){ return store.get(FAV_NAME, []); }
function playlists(){ return store.get(PL_NAME, {}); }
function isFav(id){ return favs().some(f => f.id === id); }

function toggleFav(v){
  let list = favs();
  if (list.some(f => f.id === v.id)) list = list.filter(f => f.id !== v.id);
  else list.unshift(v);
  store.set(FAV_NAME, list);
  render();
}

function cardHTML(v){
  const fav = isFav(v.id);
  const pls = Object.keys(playlists());
  const plSelect = pls.length
    ? `<select class="plsel" data-id="${esc(v.id)}" style="margin:0;width:auto;font-size:12px;padding:5px"><option value="">재생목록에 추가</option>${pls.map(p=>`<option>${esc(p)}</option>`).join("")}</select>`
    : "";
  return `<div class="card">
    <a class="thumb" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener">
      <img src="${esc(v.thumb)}" alt=""><div class="t">${esc(v.title)}</div></a>
    <div class="c">${esc(v.channel)} · ${esc(v.date)}</div>
    <div class="acts">
      <button class="ghost fav" data-v='${esc(JSON.stringify(v))}'>${fav ? "★ 즐겨찾기 해제" : "☆ 즐겨찾기"}</button>
      ${plSelect}
    </div></div>`;
}

function bindCards(root){
  root.querySelectorAll(".fav").forEach(b => b.onclick = () => toggleFav(JSON.parse(b.dataset.v)));
  root.querySelectorAll(".plsel").forEach(s => s.onchange = () => {
    if (!s.value) return;
    const pl = playlists(); const v = findVideo(s.dataset.id);
    pl[s.value] = pl[s.value] || [];
    if (v && !pl[s.value].some(x => x.id === v.id)) pl[s.value].push(v);
    store.set(PL_NAME, pl); alert("재생목록에 추가했습니다."); render();
  });
}
function findVideo(id){
  for (const k in cache) { const f = cache[k].find(x => x.id === id); if (f) return f; }
  return favs().find(x => x.id === id);
}

function parseDur(d){
  const m = (d||"").match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  return m ? (+m[1]||0)*3600 + (+m[2]||0)*60 + (+m[3]||0) : 0;
}
function isShort(v){
  return v.seconds <= 60 || /#?shorts|쇼츠/i.test(v.title);
}
const ALIASES = {
  "카르멘": ["카르멘","karmen","carmen"],
  "지우": ["지우","jiwoo"],
  "유하": ["유하","yuha"],
  "스텔라": ["스텔라","stella"],
  "주은": ["주은","juun","joo eun","jooeun"],
  "에이나": ["에이나","ain"],
  "이안": ["이안","ian"],
  "예온": ["예온","yeon","yewon"]
};
function escRe(t){ return t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function mentions(title, name){
  return (ALIASES[name] || [name]).some(a => {
    const re = /^[a-z ]+$/i.test(a) ? new RegExp("(^|[^a-z])" + escRe(a) + "([^a-z]|$)", "i") : new RegExp(escRe(a));
    return re.test(title);
  });
}
function isForMember(v, m){
  const t = v.title;
  if (!mentions(t, m)) return false;
  return !Object.keys(ALIASES).some(o => o !== m && mentions(t, o));
}
const EXTRA_QUERIES = m => [`${m} 직캠 하투하`, `Hearts2Hearts ${m} fancam`];

async function apiGet(path, params){
  const p = new URLSearchParams({...params, key: getKey()});
  const r = await fetch("https://www.googleapis.com/youtube/v3/" + path + "?" + p.toString());
  const data = await r.json();
  if (!r.ok) throw new Error(data.error && data.error.message ? data.error.message : "검색 실패");
  return data;
}
async function searchQuery(q, pageToken){
  const params = {part:"snippet", type:"video", maxResults:"50", q, regionCode:"KR", relevanceLanguage:"ko", order};
  if (pageToken) params.pageToken = pageToken;
  return apiGet("search", params);
}
function toVideo(it){
  const sn = it.snippet;
  return { id: it.id.videoId, title: sn.title, channel: sn.channelTitle, date: (sn.publishedAt || "").slice(0,10), thumb: (sn.thumbnails.medium || sn.thumbnails.default || {}).url || "", seconds: 0 };
}
async function fillDurations(list){
  const need = list.filter(v => !v.seconds);
  for (let i = 0; i < need.length; i += 50) {
    const chunk = need.slice(i, i+50);
    const data = await apiGet("videos", {part:"contentDetails", id: chunk.map(v=>v.id).join(",")});
    const map = {};
    data.items.forEach(it => map[it.id] = parseDur(it.contentDetails.duration));
    chunk.forEach(v => v.seconds = map[v.id] || 0);
  }
  return list;
}

const loading = {};
async function loadMember(m, more){
  if (!getKey()) { document.getElementById("view").innerHTML = `<div class="status">위에서 API 키를 먼저 저장해 주세요.</div>`; return; }
  if (loading[m + (more ? ":more" : "")]) return;
  loading[m + (more ? ":more" : "")] = true;
  const btn = document.getElementById("more"); if (btn) btn.textContent = "불러오는 중…";
  try {
    let items = [];
    if (!more) {
      cache[m] = []; nextTokens[m] = null;
      const queries = [`하츠투하츠 ${m} 직캠`, ...EXTRA_QUERIES(m)];
      const results = await Promise.all(queries.map((q, i) => searchQuery(q, undefined).catch(e => i === 0 ? Promise.reject(e) : {items:[], nextPageToken:null})));
      nextTokens[m] = results[0].nextPageToken || null;
      items = results.flatMap(r => r.items.map(toVideo));
    } else {
      const data = await searchQuery(`하츠투하츠 ${m} 직캠`, nextTokens[m]);
      nextTokens[m] = data.nextPageToken || null;
      items = data.items.map(toVideo);
    }
    const ids = new Set(cache[m].map(x => x.id));
    const unique = items.filter((v, i, arr) => !ids.has(v.id) && arr.findIndex(x => x.id === v.id) === i);
    await fillDurations(unique);
    const kept = unique.filter(v => !isShort(v) && isForMember(v, m));
    const merged = cache[m].concat(kept);
    cache[m] = merged.filter((v, i, arr) => arr.findIndex(x => x.id === v.id) === i).sort((a, b) => b.date.localeCompare(a.date));
    if (more) {
      const grid = document.getElementById("grid");
      if (grid) grid.insertAdjacentHTML("beforeend", kept.map(cardHTML).join(""));
      const b = document.getElementById("more");
      if (b) { if (nextTokens[m]) b.textContent = "더 보기"; else b.remove(); }
    } else render();
    bindCards(document.getElementById("view"));
  } catch(e) {
    document.getElementById("view").innerHTML = `<div class="status">불러오지 못했습니다: ${esc(e.message)}</div>`;
  } finally {
    loading[m + (more ? ":more" : "")] = false;
  }
}

function render(){
  document.getElementById("tabs").innerHTML =
    ["멤버","즐겨찾기","재생목록"].map(t => `<button class="${t===tab?"on":""}" data-t="${t}">${t}</button>`).join("") +
    `<button class="ghost" id="ord">${order==="date"?"최신순":"관련순"} ▾</button>`;
  document.querySelectorAll("#tabs [data-t]").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); if (tab==="멤버") loadMember(member); });
  document.getElementById("ord").onclick = () => { order = order==="date" ? "relevance" : "date"; localStorage.setItem(ORDER_NAME, order); cache = {}; render(); loadMember(member); };

  const view = document.getElementById("view");
  if (tab === "멤버") {
    view.innerHTML = `<div class="filters">${MEMBERS.map(m=>`<button class="${m===member?"on":""}" data-m="${m}">${m}</button>`).join("")}</div>
      <div id="memberBody"></div>`;
    view.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { member = b.dataset.m; render(); loadMember(member); });
    const body = document.getElementById("memberBody");
    const list = cache[member];
    if (!list) { body.innerHTML = `<div class="status">불러오는 중…</div>`; loadMember(member); return; }
    if (!list.length) { body.innerHTML = `<div class="status">검색 결과가 없습니다.</div>`; return; }
    body.innerHTML = `<div class="grid" id="grid">${list.map(cardHTML).join("")}</div>${nextTokens[member] ? `<button class="more ghost" id="more">더 보기</button>` : ""}`;
    const more = document.getElementById("more"); if (more) more.onclick = () => loadMember(member, true);
    bindCards(view);
  } else if (tab === "즐겨찾기") {
    const list = favs();
    view.innerHTML = list.length ? `<div class="grid">${list.map(cardHTML).join("")}</div>` : `<div class="status">즐겨찾기한 영상이 없습니다. ☆ 버튼을 눌러 추가하세요.</div>`;
    bindCards(view);
  } else {
    const pl = playlists();
    const names = Object.keys(pl);
    view.innerHTML = `
      <div class="box"><input id="plname" placeholder="새 재생목록 이름 (예: 지우 무대 모음)"/>
      <button id="plnew" style="margin-top:8px">재생목록 만들기</button></div>
      ${names.length ? names.map(n => `<div class="pl"><h3>${esc(n)} (${pl[n].length})</h3>
          <div class="grid">${pl[n].map(v => cardHTML(v)).join("")}</div>
          <button class="ghost plrm" data-n="${esc(n)}" style="margin-top:8px">재생목록 삭제</button></div>`).join("") : `<div class="status">재생목록이 없습니다.</div>`}`;
    document.getElementById("plnew").onclick = () => {
      const n = document.getElementById("plname").value.trim();
      if (!n) return;
      pl[n] = pl[n] || []; store.set(PL_NAME, pl); render();
    };
    view.querySelectorAll(".plrm").forEach(b => b.onclick = () => {
      if (!confirm("이 재생목록을 삭제할까요?")) return;
      const p = playlists(); delete p[b.dataset.n]; store.set(PL_NAME, p); render();
    });
    bindCards(view);
  }
}

document.getElementById("saveKey").onclick = () => {
  const v = document.getElementById("key").value.trim();
  if (!v) return;
  try { localStorage.setItem(KEY_NAME, v); } catch(e){}
  document.getElementById("key").value = "";
  document.getElementById("setup").style.display = "none";
  cache = {}; render(); loadMember(member);
};
if (getKey()) document.getElementById("setup").style.display = "none";
render();
loadMember(member);
</script>
</body></html>
